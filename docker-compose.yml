services:
  postgres:
    container_name: pedidos-postgres
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - pedidos_postgres_data:/var/lib/postgresql/data

volumes:
  pedidos_postgres_data: